<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>和大肥鱼一起看 · 独立试映室</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#091525;color:#e5edf7;font:15px/1.6 system-ui}header{padding:20px 32px;border-bottom:1px solid #27425c;display:flex;justify-content:space-between}h1{margin:0;font-size:23px;color:#ead5a4}small,.muted{color:#9bb5cb}main{padding:24px;display:grid;grid-template-columns:minmax(0,3fr) minmax(280px,1fr);gap:20px}.screen{position:relative;background:#030911;border-radius:16px;overflow:hidden;aspect-ratio:16/9}video{width:100%;height:100%;object-fit:contain}#film-sub{position:absolute;bottom:45px;left:8%;right:8%;text-align:center;white-space:pre-line;text-shadow:0 2px 5px #000;font-size:22px;pointer-events:none}.card{background:#12253b;border:1px solid #2b4660;border-radius:16px;padding:18px;margin-bottom:16px}#avatar{height:370px;position:relative;background:radial-gradient(ellipse,#365372,#112238);border-radius:14px;overflow:hidden}iframe{border:0;width:100%;height:100%}#reply{min-height:80px;padding:15px;background:#0b1b2b;border-radius:12px;margin-top:12px;font-size:18px}button,.file{display:inline-block;background:#d9c28f;color:#14273d;padding:9px 15px;border:0;border-radius:9px;font:inherit;cursor:pointer;margin:4px}button.secondary{background:#29435b;color:#e5edf7}button:disabled{opacity:.4}input[type=file]{display:none}input[type=text]{background:#0b1b2b;border:1px solid #365570;border-radius:8px;color:white;padding:10px;width:70%}#log{max-height:260px;overflow:auto;font-size:13px}.entry{padding:9px 0;border-bottom:1px solid #29435b}#status{color:#8edbcc}#frames{display:flex;gap:5px;overflow:auto;margin-top:10px}#frames img{width:110px;border-radius:5px}#zoom{position:absolute;top:12px;right:12px;max-width:48%;max-height:65%;border:2px solid #d9c28f;display:none}#error{color:#ffb1ad}audio{width:100%;height:30px;margin-top:10px}@media(max-width:900px){main{grid-template-columns:1fr}#avatar{height:280px}}
</style>
<header><div><h1>和大肥鱼一起看</h1><small>独立试映室 · 画面与字幕 · 不连接 B 站</small></div><span id="status">正在连接</span></header>
<main><section><div class="screen"><video id="film" controls playsinline></video><div id="film-sub"></div><img id="zoom" alt="大肥鱼请求放大的已播放画面"></div>
<div class="card"><label class="file">选择视频<input id="file" type="file" accept="video/*"></label><label class="file">选择 SRT / VTT 字幕<input id="subs" type="file" accept=".srt,.vtt"></label><span id="filename" class="muted">文件留在本机，仅抽样帧和已播放字幕发给模型</span><br>
<button id="start" disabled>开始陪看</button><button id="stop" class="secondary">停止观察</button><button id="once" class="secondary" disabled>看看此刻</button><button id="resume" class="secondary">继续播放</button>
<p class="muted">每轮由她选择是否开口；可以暂停、回看或放大。首次试映最多 5 分钟、80 次模型调用（观察与回应各一次）。原声供你听，本版不把原声转写给模型。</p>
<input id="question" type="text" maxlength="500" placeholder="可以问她刚才看到了什么"><button id="ask" class="secondary">问她</button><div id="error"></div></div>
<div class="card"><b>她实际收到的抽样画面</b><span id="stats" class="muted"></span><p id="budget" class="muted"></p><div id="frames"></div></div><div class="card"><b>连续剧情（她自己整理，可修正）</b><p id="story">尚无剧情记录</p><b>还不确定</b><p id="uncertain">暂无</p><b>她想继续关注</b><p id="interest">暂无</p></div></section>
<aside><div id="avatar"><iframe id="pet" title="大肥鱼 Live2D"></iframe></div><div id="reply">选一段动画，我们一起看。</div><audio id="voice" controls></audio><div class="card" style="margin-top:16px"><b>本次观察记录</b><div id="log"></div></div></aside></main>
<script type="module" src="/reaction.js"></script></html>
